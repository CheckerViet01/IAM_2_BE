server:
  port: 8080

spring:
  application:
    name: IAM_2_BE

  datasource:
    url: jdbc:sqlserver://localhost:24333;databaseName=IAM_Service_2;encrypt=false;trustServerCertificate=true
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.SQLServerDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/iam-realm
          jwk-set-uri: http://localhost:8180/realms/iam-realm/protocol/openid-connect/certs

# ===================================================================
# APPLICATION CONFIGURATION: DUAL-IDP (KEYCLOAK / SELF)
# ===================================================================
app:
  idp:
    provider: keycloak # Chế độ: 'keycloak' hoặc 'self'
  keycloak:
    auth-server-url: http://localhost:8180
    realm: iam-realm
    client-id: iam-frontend
    admin-client-id: iam-admin-client
    admin-client-secret: gRteLWut1BX6oVkBSmZexeV5wf6IwNMg8GaUFv94fpvragDBBTM04gmThFU29J5uDzGduVeHhs9keWAhrWABJX
    login-page-url: http://localhost:8180/realms/iam-realm/protocol/openid-connect/auth?client_id=iam-frontend&response_type=token&redirect_uri=http://localhost:4200/&scope=openid%20profile%20email
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 3600000        # 1 giờ (ms)
    refresh-expiration: 604800000 # 7 ngày (ms)

# ===================================================================
# SWAGGER / OPENAPI 3
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
